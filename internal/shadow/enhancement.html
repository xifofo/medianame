<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>medianame 增强识别验证</title>
<style>
*{box-sizing:border-box}body{font:14px/1.65 system-ui,-apple-system,sans-serif;background:#f3f6fa;color:#25364b;max-width:1440px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}p{color:#647388}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.card{background:white;padding:18px;border:1px solid #dce4ed;border-radius:10px}.stat strong{display:block;font-size:28px}.filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}input,select{font:inherit;padding:9px;border:1px solid #c8d2e0;border-radius:6px}input{flex:1;min-width:230px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:12px;border-bottom:1px solid #e3e9f0;vertical-align:top}th{font-size:12px;color:#69798e;background:#f7f9fc}td.name{min-width:240px;max-width:600px;overflow-wrap:anywhere}.badge{display:inline-block;white-space:nowrap;padding:3px 7px;border-radius:4px;background:#e9eef4}.compatible{background:#e5f3e9;color:#226f3b}.review{background:#fff0d1;color:#855a00}.no_candidate,.request_error{background:#fce6e6;color:#9b3333}small{display:block;color:#728095}details{margin-top:8px}summary{cursor:pointer;color:#2868aa}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;min-width:280px;background:#f4f7fb;padding:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}body{padding:16px}}
</style>
<h1>medianame 增强识别验证</h1><p id="scope"></p>
<div class="stats" id="stats"></div>
<p>原始名称未识别或身份有冲突的记录，由包生成清理后的片名、年份和同年份别名，再交给同一个 MP2 查询。无冲突候选经过标题、年份、解析类型与 ID 检查，尚未经人工确认；原始基线保留。</p>
<div class="card"><div class="filters"><input aria-label="搜索样本" id="search" placeholder="搜索原名、片名、查询文本"><select aria-label="增强结果" id="status"><option value="all">全部结果</option><option value="compatible">无冲突候选</option><option value="review">需要核对</option><option value="no_candidate">未返回候选</option><option value="request_error">请求错误</option><option value="no_query">无法生成查询</option></select></div><p id="count"></p><div class="scroll"><table><thead><tr><th>行</th><th>原始输入 / 本地片名</th><th>类型</th><th>发布组</th><th>原始 MP2</th><th>增强结果</th><th>返回候选与查询</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script type="application/json" id="data">@@ENHANCEMENT_JSON@@</script>
<script>
'use strict';const report=JSON.parse(document.getElementById('data').textContent),labels={compatible:'无冲突候选',review:'需要核对',no_candidate:'未返回候选',request_error:'请求错误',no_query:'无法生成查询',identified:'有候选',not_identified:'未识别',error:'请求错误'};
const typeLabels={movie:'电影（movie）',tv:'剧集（tv）',unknown:'未识别'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
document.getElementById('scope').textContent='本轮 '+report.records.length+' 条记录 · '+(report.complete?'已完成':'进行中');
for(const [name,value] of [['原文件名失败后获无冲突候选',report.summary.baseline_failed_now_compatible||0],['本轮无冲突候选',report.summary.compatible||0],['待核对',report.summary.review||0],['未返回候选',report.summary.no_candidate||0]]){const n=el('div',undefined,'stat');n.append(el('strong',value),el('span',name));document.getElementById('stats').append(n)}
function render(){const search=document.getElementById('search').value.toLowerCase(),status=document.getElementById('status').value;const selected=report.records.filter(r=>(status==='all'||r.status===status)&&(!search||[r.name,r.local.title,...(r.attempts||[]).map(a=>a.query.text)].join(' ').toLowerCase().includes(search)));document.getElementById('count').textContent='显示 '+selected.length+' / '+report.records.length+' 条';const body=document.getElementById('rows');body.replaceChildren();for(const r of selected){const row=el('tr');row.append(el('td',r.line));const name=el('td',undefined,'name');name.append(el('div',r.name),el('small',r.local.title+' / '+(r.local.year||'年份未知')));const detail=el('details');detail.append(el('summary','查看查询与冲突证据'),el('pre',JSON.stringify({path:r.path,local:r.local,baseline:r.baseline,attempts:r.attempts},null,2)));name.append(detail);row.append(name,el('td',typeLabels[r.local.type]||'未识别'),el('td',r.local.release_group||'—'),el('td',labels[r.baseline_status]||r.baseline_status));const statusCell=el('td');statusCell.append(el('span',labels[r.status]||r.status,'badge '+r.status));row.append(statusCell);const candidate=el('td');for(const a of r.attempts||[]){const m=a.result.media;candidate.append(el('div',m?m.title+' ('+(m.year||'?')+')':'—'),el('small',a.query.text));if(a.conflicts?.length)candidate.append(el('small',a.conflicts.map(c=>c.field+': '+c.expected+' → '+c.actual).join('；')))}row.append(candidate);body.append(row)}}
for(const id of ['search','status'])document.getElementById(id).addEventListener('input',render);render();
</script></html>
