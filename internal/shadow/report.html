<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP2 / medianame 影子测试</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243246;background:#f2f5f8;font-size:14px}*{box-sizing:border-box}body{max-width:1500px;margin:0 auto;padding:28px}h1{font-size:26px;margin:0 0 10px}h2{font-size:17px}p{line-height:1.7}.muted{color:#697789}.card{background:#fff;border:1px solid #e0e6ec;border-radius:12px;padding:18px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:white;border:1px solid #e0e6ec;border-radius:12px;padding:16px}.stat strong{display:block;font-size:27px;margin-bottom:5px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select{padding:10px 12px;border:1px solid #cdd6e0;border-radius:7px;background:white;font:inherit}input{flex:1;min-width:260px}button{font:inherit;cursor:pointer}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f6f8fa;color:#5e6b7a;font-size:12px}th,td{padding:12px;border-bottom:1px solid #e6ebf0;vertical-align:top}td.name{min-width:280px;max-width:640px;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:5px;padding:4px 7px;white-space:nowrap;font-size:12px;background:#eaf6ef;color:#267445}.different,.warning{background:#fff0d8;color:#916008}.error,.failure{background:#fce9e7;color:#a2332e}.pending{background:#eef0f3;color:#697789}.detail-button{border:0;color:#245ca5;background:#edf4fc;border-radius:5px;padding:6px 9px}.details{background:#f8fafc}.details td{padding:16px}.diff-value{background:#fff0d8}.raw{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border:1px solid #dfe5eb;border-radius:7px;max-height:420px;overflow:auto}.field-list{display:flex;flex-wrap:wrap;gap:6px}.field-chip{border:1px solid #dce2ea;border-radius:5px;background:white;padding:5px 8px;font-size:12px}.section-title{margin-bottom:8px}.note{color:#66768a;font-size:12px;line-height:1.6}@media(max-width:900px){body{padding:16px}.stats{grid-template-columns:repeat(3,1fr)}.raw{grid-template-columns:1fr}}
</style>
<h1>MP2 / medianame 影子测试</h1><div class="muted" id="meta"></div>
<div class="stats" id="stats"></div>
<div class="card"><p id="scope"></p><p class="note">解析差异基于相同文件名及统一格式后的字段。MP2 在线识别状态另存，返回媒体候选尚未经人工确认。目录路径来自目录树；报告不会移动或重命名文件。完整在线原始响应见 report.json。</p><div class="field-list" id="fields"></div></div>
<div class="card"><div class="filters"><input id="search" placeholder="搜索文件名、目录或 MP2 媒体标题" aria-label="搜索样本"><select id="status" aria-label="解析状态"><option value="all">全部解析状态</option><option value="different">解析有差异</option><option value="matched">解析一致</option><option value="mp2_error">解析接口错误</option></select><select id="recognition" aria-label="识别状态"><option value="all">全部识别状态</option><option value="not_identified">文件名未识别</option><option value="unresolved">追加路径仍未识别</option><option value="recovered">目录路径有候选</option><option value="identified">文件名有候选</option><option value="error">识别请求错误</option><option value="local_empty">本地无片名</option></select><select id="field" aria-label="差异字段"><option value="all">全部差异字段</option></select></div><p class="note" id="visible"></p><div class="table-wrap"><table><thead><tr><th>目录树行</th><th>文件 / 目录</th><th>解析比对</th><th>MP2 文件名识别</th><th>目录补充</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script type="application/json" id="report-data">@@REPORT_JSON@@</script>
<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent),summary=report.summary;
const labels={title:'片名',type:'类型',year:'年份',season:'开始季',season_end:'结束季',episode:'开始集',episode_end:'结束集',episodes:'集列表',resolution:'分辨率',source:'来源',video_codec:'视频编码',audio_codec:'音频编码',audio_channels:'声道',effects:'效果',bit_depth:'位深',fps:'帧率',release_group:'发布组',streaming_service:'平台',part:'分卷',episode_group:'剧集组',tmdb_id:'TMDB ID',douban_id:'豆瓣 ID',bangumi_id:'Bangumi ID',anilist_id:'AniList ID'};
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n}
document.getElementById('meta').textContent=report.created_at+' · '+report.base_url+' · '+report.input_encoding+(report.complete?' · 本批次完成':' · 本批次尚未完成');
document.getElementById('scope').textContent='共 '+summary.total+' 个视频文件，'+summary.unique_names+' 个不同文件名。源文件：'+report.input_file;
for(const [label,value] of [['解析一致',summary.matched],['解析差异',summary.different],['文件名未识别',summary.not_identified],['路径有候选',summary.path_recovered],['追加路径仍未识别',summary.path_not_identified],['接口错误',summary.parse_errors+summary.recognition_errors+summary.path_errors]]){const n=el('div',undefined,'stat');n.append(el('strong',value),el('span',label,'muted'));document.getElementById('stats').append(n)}
for(const field of [...summary.fields].sort((a,b)=>b.different-a.different)){if(!field.compared)continue;const b=el('button',(labels[field.field]||field.field)+'：'+field.different+'/'+field.compared+' 差异','field-chip');b.onclick=()=>{document.getElementById('field').value=field.field;render()};document.getElementById('fields').append(b);const o=el('option',labels[field.field]||field.field);o.value=field.field;document.getElementById('field').append(o)}
function badge(status){const text={matched:'一致',different:'有差异',mp2_error:'接口错误',identified:'有候选',not_identified:'未识别',error:'请求错误'};return el('span',text[status]||'未测试','badge '+(status==='not_identified'?'failure':status||'pending'))}
function recognitionCell(value){const cell=el('td');cell.append(badge(value?.status));if(value?.media){cell.append(el('div',(value.media.title||'')+(value.media.year?' ('+value.media.year+')':'')));cell.append(el('div',(value.media.source||'')+' '+(value.media.media_id||value.media.tmdb_id||''),'note'))}if(value?.error)cell.append(el('div',value.error,'note'));return cell}
function value(v){return v===null||v===undefined?'—':typeof v==='string'?v:JSON.stringify(v)}
function details(r){const tr=el('tr',undefined,'details'),td=el('td');td.colSpan=6;const table=el('table'),head=el('tr');for(const text of ['字段','medianame','MP2 原始解析（统一格式后）'])head.append(el('th',text));table.append(head);const changed=new Set((r.differences||[]).map(d=>d.field));for(const key of Object.keys(r.local_fields)){const row=el('tr');if(changed.has(key))row.className='diff-value';row.append(el('td',labels[key]||key),el('td',value(r.local_fields[key])),el('td',value(r.mp2_fields?.[key])));table.append(row)}td.append(table);if(r.error)td.append(el('p',r.error));const raw=el('div',undefined,'raw');for(const [label,obj] of [['medianame 原始结果',{name:r.local,path:r.local_path}],['MP2 原始名称解析及识别身份',{parse:r.mp2,recognition:r.recognition,path_recognition:r.path_recognition}]]){const section=el('section');section.append(el('h2',label),el('pre',JSON.stringify(obj,null,2)));raw.append(section)}td.append(raw);tr.append(td);return tr}
function render(){const search=document.getElementById('search').value.toLowerCase(),status=document.getElementById('status').value,recognition=document.getElementById('recognition').value,field=document.getElementById('field').value;const records=report.records.filter(r=>{if(search&&!([r.name,r.path,r.recognition?.media?.title,r.path_recognition?.media?.title].join(' ').toLowerCase().includes(search)))return false;if(status!=='all'&&r.status!==status)return false;if(field!=='all'&&!(r.differences||[]).some(d=>d.field===field))return false;if(recognition==='not_identified'&&r.recognition?.status!=='not_identified')return false;if(recognition==='unresolved'&&r.path_recognition?.status!=='not_identified')return false;if(recognition==='recovered'&&r.path_recognition?.status!=='identified')return false;if(recognition==='identified'&&r.recognition?.status!=='identified')return false;if(recognition==='error'&&r.recognition?.status!=='error'&&r.path_recognition?.status!=='error')return false;if(recognition==='local_empty'&&r.local.title!=='')return false;return true});document.getElementById('visible').textContent='显示 '+records.length+' / '+report.records.length+' 个样本';const body=document.getElementById('rows');body.replaceChildren();for(const r of records){const row=el('tr');row.append(el('td',r.line));const name=el('td',undefined,'name');name.append(el('div',r.name),el('div',r.path,'note'));row.append(name);const parse=el('td');parse.append(badge(r.status));if(r.differences?.length)parse.append(el('div',r.differences.map(d=>labels[d.field]||d.field).join('、'),'note'));row.append(parse,recognitionCell(r.recognition),recognitionCell(r.path_recognition));const cell=el('td'),button=el('button','展开','detail-button');let detail=null;button.onclick=()=>{if(detail){detail.remove();detail=null;button.textContent='展开'}else{detail=details(r);row.after(detail);button.textContent='收起'}};cell.append(button);row.append(cell);body.append(row)}}
for(const id of ['search','status','recognition','field'])document.getElementById(id).addEventListener('input',render);render();
</script></html>
